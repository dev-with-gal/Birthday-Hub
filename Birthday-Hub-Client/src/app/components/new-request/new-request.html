<button class="floating-add" type="button" aria-label="יצירת בקשה חדשה" (click)="openModal()">
  +
</button>

<div *ngIf="isOpen" class="modal-backdrop" (click)="closeModal()">
  <section
    class="request-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="request-title"
    (click)="$event.stopPropagation()"
  >
    <button class="close-button" type="button" aria-label="סגירה" (click)="closeModal()">×</button>

    <h2 id="request-title">בקשה חדשה</h2>

    <form (ngSubmit)="submitRequest()">
      <label for="request-name">שם</label>
      <input id="request-name" name="name" type="text" [(ngModel)]="name" required />

      <label for="department">מחלקה</label>
      <select id="department" name="department" required>
        <option value="" disabled selected>בחרו מחלקה</option>
        <option *ngFor="let department of departments" [value]="department">
          {{ department }}
        </option>
      </select>

      <label for="request-birthdate">תאריך לידה</label>
      <input id="request-birthdate" name="birthdate" type="date" [(ngModel)]="birthdate" required />

      <label for="request-image">תמונה</label>
      <input
        id="request-image"
        name="image"
        type="file"
        accept="image/*"
        (change)="onImageSelected($event)"
      />

      <img
        *ngIf="imagePreview"
        class="image-preview"
        [src]="imagePreview"
        alt="תצוגה מקדימה של התמונה שנבחרה"
      />

      <button class="submit-button" type="submit">יצירת בקשה</button>
    </form>
  </section>
</div>
