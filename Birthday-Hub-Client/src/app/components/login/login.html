<main class="login" dir="rtl" lang="he">
  <h1 class="login__title">התחברות</h1>

  <form class="login__form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="login__field">
      <label class="login__label" for="email">כתובת אימייל</label>
      <input
        class="login__input"
        id="email"
        name="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        required
      />
    </div>

    <div class="login__field">
      <label class="login__label" for="password">סיסמה</label>
      <input
        class="login__input"
        id="password"
        name="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        required
      />
    </div>

    @if (errorMessage()) {
      <p class="login__message" role="alert">{{ errorMessage() }}</p>
    }

    <button class="login__submit" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'מתחבר...' : 'התחברות' }}
    </button>
  </form>

  <p class="login__signup-prompt">אין לך חשבון?</p>
  <a class="login__signup-button" href="/signup">
    הרשמה
  </a>
</main>
