<main class="signup" dir="rtl" lang="he">
  <h1 class="signup__title">הרשמה</h1>

  <form class="signup__form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="signup__field">
      <label class="signup__label" for="email">כתובת Gmail</label>
      <input
        class="signup__input"
        id="email"
        name="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="name@gmail.com"
        required
      />
    </div>

    <div class="signup__field">
      <label class="signup__label" for="password">סיסמה</label>
      <input
        class="signup__input"
        id="password"
        name="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        required
      />
    </div>

    <div class="signup__field">
      <label class="signup__label" for="confirm-password">אימות סיסמה</label>
      <input
        class="signup__input"
        id="confirm-password"
        name="confirmPassword"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        required
      />
    </div>

    @if (errorMessage()) {
      <p class="signup__message signup__message--error" role="alert">{{ errorMessage() }}</p>
    }

    <button class="signup__submit" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'יוצר חשבון...' : 'יצירת חשבון' }}
    </button>
  </form>
</main>
