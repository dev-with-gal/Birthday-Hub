<main class="signup">
  <h1 class="signup__title">{{ text.signup.title }}</h1>

  <form class="signup__form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="signup__field">
      <label class="signup__label" for="email">{{ text.signup.email }}</label>
      <input
        class="signup__input"
        id="email"
        name="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="name@gmail.com"
        required
      />
    </div>

    <div class="signup__field">
      <label class="signup__label" for="password">{{ text.signup.password }}</label>
      <input
        class="signup__input"
        id="password"
        name="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        required
      />
    </div>

    <div class="signup__field">
      <label class="signup__label" for="confirm-password">{{ text.signup.confirmPassword }}</label>
      <input
        class="signup__input"
        id="confirm-password"
        name="confirmPassword"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        required
      />
    </div>

    @if (errorMessage()) {
      <p class="signup__message signup__message--error" role="alert">{{ errorMessage() }}</p>
    }

    <button class="signup__submit" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? text.signup.submitting : text.signup.submit }}
    </button>
  </form>
</main>
