<header class="header" dir="rtl">
  <div class="header-brand-greeting">
    <h1 class="header-title app-title">
      <svg
        class="header-logo"
        role="img"
        aria-label="עוגת יום הולדת"
        viewBox="0 0 48 48"
        width="40"
        height="40"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M10 27h28v13H10z"
          fill="#F7A8B8"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"
        />
        <path
          d="M10 32c3 0 3-2 6-2s3 2 6 2 3-2 6-2 3 2 6 2 3-2 6-2"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
        <path d="M8 40h32" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <path
          d="M16 27v-7m8 7V17m8 10v-7"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
        <path
          d="M16 16c-2-2 2-3 0-5m8 4c-2-2 2-3 0-5m8 7c-2-2 2-3 0-5"
          stroke="#F2A900"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
      מרכז ימי ההולדת<br />
    </h1>
    <p class="header-greeting">שלום, משתמש</p>
  </div>

  <nav class="header-links" aria-label="ניווט ראשי">
    <a class="header-link" href="/">בית</a>
    @if (auth.authenticated()) {
      <a class="header-link" href="/my-requests">הבקשות שלי</a>
      <a class="header-link" href="/all-requests">בקשות</a>
      <a class="header-link" href="/mini-game">משחק</a>
      <a
        class="header-link"
        href="/login"
        aria-label="התנתקות"
        title="התנתקות"
        (click)="logout($event)"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M10 17l5-5-5-5" />
          <path d="M15 12H3" />
          <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
        </svg>
      </a>
    } @else {
      <a class="header-link" href="/login">התחברות</a>
      <a class="header-link" href="/signup">הרשמה</a>
    }
  </nav>
</header>
