<main class="signup" dir="rtl" lang="he">
  <h1 class="signup__title">הרשמה</h1>

  <form class="signup__form" method="post" action="/signup">
    <div class="signup__field">
      <label class="signup__label" for="email">כתובת Gmail</label>
      <input
        class="signup__input"
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="name@gmail.com"
        required
      />
    </div>

    <div class="signup__field">
      <label class="signup__label" for="password">סיסמה</label>
      <input
        class="signup__input"
        id="password"
        name="password"
        type="password"
        autocomplete="new-password"
        required
      />
    </div>

    <div class="signup__field">
      <label class="signup__label" for="confirm-password">אימות סיסמה</label>
      <input
        class="signup__input"
        id="confirm-password"
        name="confirmPassword"
        type="password"
        autocomplete="new-password"
        required
      />
    </div>

    <button class="signup__submit" type="submit">יצירת חשבון</button>
  </form>
</main>
