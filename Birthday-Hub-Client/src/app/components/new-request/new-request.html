<button
  class="floating-add"
  type="button"
  [attr.aria-label]="text.requestForm.createTitle"
  [disabled]="!auth.authenticated()"
  [title]="auth.authenticated() ? text.requestForm.createTitle : text.requestForm.loginRequired"
  (click)="openModal()"
>
  +
</button>

<p *ngIf="successMessage()" class="request-status" role="status">
  {{ successMessage() }}
</p>

<div *ngIf="isOpen()" class="modal-backdrop" (click)="closeModal()">
  <section
    class="request-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="request-title"
    (click)="$event.stopPropagation()"
  >
    <button
      class="close-button"
      type="button"
      [attr.aria-label]="text.requestForm.close"
      (click)="closeModal()"
    >
      ×
    </button>

    <h2 id="request-title">{{ text.requestForm.title }}</h2>

    <form (ngSubmit)="submitRequest()">
      <label for="request-first-name">{{ text.requestForm.firstName }}</label>
      <input
        id="request-first-name"
        name="firstName"
        type="text"
        [(ngModel)]="firstName"
        required
      />

      <label for="request-last-name">{{ text.requestForm.lastName }}</label>
      <input id="request-last-name" name="lastName" type="text" [(ngModel)]="lastName" required />

      <label for="department">{{ text.requestForm.department }}</label>
      <select id="department" name="department" [(ngModel)]="department" required>
        <option value="" disabled>{{ text.requestForm.chooseDepartment }}</option>
        <option *ngFor="let department of departments" [value]="department">
          {{ department }}
        </option>
      </select>

      <label for="request-birthdate">{{ text.requestForm.birthday }}</label>
      <input id="request-birthdate" name="birthdate" type="date" [(ngModel)]="birthdate" required />

      <p *ngIf="errorMessage()" class="request-error" role="alert">
        {{ errorMessage() }}
      </p>

      <button class="submit-button" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? text.requestForm.submitting : text.requestForm.submit }}
      </button>
    </form>
  </section>
</div>
