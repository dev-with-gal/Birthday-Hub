<button
  class="floating-add"
  type="button"
  aria-label="יצירת בקשה חדשה"
  [disabled]="!auth.authenticated()"
  [title]="auth.authenticated() ? 'יצירת בקשה חדשה' : 'יש להתחבר כדי ליצור בקשה'"
  (click)="openModal()"
>
  +
</button>

<p *ngIf="successMessage()" class="request-status" role="status">
  {{ successMessage() }}
</p>

<div *ngIf="isOpen()" class="modal-backdrop" (click)="closeModal()">
  <section
    class="request-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="request-title"
    (click)="$event.stopPropagation()"
  >
    <button class="close-button" type="button" aria-label="סגירה" (click)="closeModal()">×</button>

    <h2 id="request-title">בקשה חדשה</h2>

    <form (ngSubmit)="submitRequest()">
      <label for="request-first-name">שם פרטי</label>
      <input
        id="request-first-name"
        name="firstName"
        type="text"
        [(ngModel)]="firstName"
        required
      />

      <label for="request-last-name">שם משפחה</label>
      <input id="request-last-name" name="lastName" type="text" [(ngModel)]="lastName" required />

      <label for="department">מחלקה</label>
      <select id="department" name="department" [(ngModel)]="department" required>
        <option value="" disabled>בחרו מחלקה</option>
        <option *ngFor="let department of departments" [value]="department">
          {{ department }}
        </option>
      </select>

      <label for="request-birthdate">תאריך לידה</label>
      <input id="request-birthdate" name="birthdate" type="date" [(ngModel)]="birthdate" required />

      <p *ngIf="errorMessage()" class="request-error" role="alert">
        {{ errorMessage() }}
      </p>

      <button class="submit-button" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'שולח...' : 'יצירת בקשה' }}
      </button>
    </form>
  </section>
</div>
